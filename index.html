<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MC 加载器 (4MB × 19)</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f5f5f7;
    color: #6e6e73;
    font-size: 14px;
  }
  #status {
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div id="status">正在加载分块...</div>

<script>
// 分块总数改为 19（适配 4MB 分块）
const TOTAL_PARTS = 19;
const BASE_NAME = 'MC';

async function loadParts() {
  const status = document.getElementById('status');
  const buffers = [];

  // 依次加载 MC.part001.html ~ MC.part019.html
  for (let i = 1; i <= TOTAL_PARTS; i++) {
    const partName = `${BASE_NAME}.part${String(i).padStart(3, '0')}.html`;
    status.textContent = `正在加载 ${partName} ... (${i}/${TOTAL_PARTS})`;

    try {
      const res = await fetch(partName);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      buffers.push(new Uint8Array(buf));
    } catch (e) {
      status.textContent = `加载失败：${partName}（${e.message}）\n请确认该文件与 mc.html 在同一目录下。`;
      return;
    }
  }

  status.textContent = '正在合并...';

  const totalLen = buffers.reduce((s, b) => s + b.byteLength, 0);
  const merged = new Uint8Array(totalLen);
  let offset = 0;
  for (const b of buffers) {
    merged.set(b, offset);
    offset += b.byteLength;
  }

  const blob = new Blob([merged], { type: 'text/html' });
  const url = URL.createObjectURL(blob);

  status.textContent = '合并完成，正在跳转...';
  // 跳转到合并后的完整页面
  window.location.replace(url);
}

loadParts();
</script>

</body>
</html>
